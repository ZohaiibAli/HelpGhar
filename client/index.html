<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HelpGhar — Trusted Home Services at Your Doorstep</title>
    <meta name="description" content="Pakistan's trusted marketplace for verified home service workers — maids, drivers, cooks, electricians and more." />
    <script>
      // Apply saved color mode + text direction before first paint (no flash).
      try {
        var m = localStorage.getItem("hg-color-mode");
        if (!m) m = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        if (m === "dark") document.documentElement.classList.add("dark");
        if (localStorage.getItem("hg-lang") === "ur") {
          document.documentElement.dir = "rtl";
          document.documentElement.lang = "ur";
        }
      } catch (e) {}
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500;1,9..144,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
